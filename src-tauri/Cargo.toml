[package]
name = "d4c"
version = "0.2.4"
description = "Sanctuary Toolkit, a Diablo IV companion"
authors = ["Kenneth Blossom"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/mscrnt/diablo-companion"
edition = "2021"

[lib]
name = "d4c_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "~2.12"
tauri-plugin-process = "~2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
anyhow = "1"
# debug report zip, and unpacking the icon model asset (deflate only; already in the lockfile via the updater)
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# checking the icon model download against the SHA-256 the app was built with
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Input_KeyboardAndMouse",
] }

# dev builds: optimise dependencies (image capture, resize, JPEG) so screen reading runs at
# near-release speed; the app crate itself stays unoptimised for quick rebuilds and debugging
[profile.dev.package."*"]
opt-level = 2
