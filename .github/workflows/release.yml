name: Release

# Two ways to cut a release:
#  - Actions → Release → Run workflow, with a version (x.y.z) or patch / minor / major.
#    It bumps the version files, commits, tags vX.Y.Z on main and builds.
#  - Or locally: `npm run version -- 0.2.0`, commit, `git tag v0.2.0`, push the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version: x.y.z, or patch / minor / major"
        required: true
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/bump-version.mjs "$VERSION"
          v=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "::error::tag v$v already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$v"
          git tag -a "v$v" -m "D4 Companion $v"
          git push origin HEAD:main "v$v"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    # runs after the tag job, or on its own when a tag was pushed
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: windows-latest
    # the Azure federated credential trusts this environment, whichever tag or branch runs it
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.tag.outputs.tag || github.ref_name }}
      # code signing switches on once the AZURE_CLIENT_ID repo variable exists
      SIGN: ${{ vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches the app version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG but package.json says $v — run scripts/bump-version.mjs first"; exit 1; }

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          notes=$(node scripts/release-notes.mjs "$TAG") || { echo "::error::add a $TAG section to CHANGELOG.md (or notes under Unreleased before bumping)"; exit 1; }
          { echo "body<<CHANGELOG_EOF"; echo "$notes"; echo "CHANGELOG_EOF"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - run: rustup toolchain install
        working-directory: src-tauri

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---- Azure Artifact Signing (OIDC, no stored secret) ----
      - name: Azure login
        if: env.SIGN == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Tauri calls signtool with Microsoft's signing dlib on the app exe, the
      # uninstaller and the installer. The config is generated here so the paths
      # resolve on the runner; local builds stay unsigned.
      - name: Set up code signing
        if: env.SIGN == 'true'
        uses: ./.github/actions/setup-signing
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          account: ${{ vars.SIGNING_ACCOUNT }}
          profile: ${{ vars.SIGNING_PROFILE }}

      - name: Use the signing config
        if: env.SIGN == 'true'
        shell: bash
        run: echo "TAURI_EXTRA_ARGS=--config src-tauri/tauri.signing.json" >> "$GITHUB_ENV"

      # builds the recommended small NSIS installer (static CRT + WebView2 bootstrapper)
      # and attaches it to the release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ env.TAURI_EXTRA_ARGS }}
          tagName: ${{ env.TAG }}
          releaseName: D4 Companion ${{ env.TAG }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            ## Install
            Download one of these below and run it. Both install for your user only (no admin needed), and installing over an older version keeps your settings.
            - **D4 Companion_*_x64-setup.exe** (recommended, small). Uses the WebView2 runtime that Windows 10 and 11 already have, and fetches it only if it's missing.
            - **D4 Companion_*_x64-offline-setup.exe** (large). Includes the WebView2 runtime, for PCs without internet access.

            ${{ env.SIGN == 'true' && 'The installer is code-signed. A brand-new signing identity can still trigger a SmartScreen prompt for the first releases while it builds reputation: click *More info → Run anyway*.' || 'Windows may show a SmartScreen warning because the installer isn''t code-signed yet: click *More info → Run anyway*.' }}
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}

      - name: Verify signatures
        if: env.SIGN == 'true'
        shell: pwsh
        # check the installer and the app exe packed inside it (Tauri swaps the
        # copy left in target/release after bundling, so that one isn't what ships)
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP "installer"
          7z x -y "-o$out" $setup.FullName d4c.exe | Out-Null
          $files = @($setup, (Get-Item (Join-Path $out "d4c.exe")))
          $files | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; "{0}: {1} ({2})" -f $_.Name, $s.Status, $s.SignerCertificate.Subject }
          $bad = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { throw "unsigned or invalid: $($bad.Name -join ', ')" }

      # second installer with the full offline WebView2 runtime. Only the bundle
      # differs, so this mostly re-packages the app built above.
      - name: Build the offline installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          Remove-Item "$nsis/*-setup.exe"
          $extra = if ($env:TAURI_EXTRA_ARGS) { $env:TAURI_EXTRA_ARGS -split ' ' } else { @() }
          npm run tauri -- build --bundles nsis --config src-tauri/tauri.offline.json @extra
          if ($LASTEXITCODE -ne 0) { throw "offline build failed" }
          $setup = Get-ChildItem $nsis -Filter *-setup.exe | Select-Object -First 1
          $offline = Join-Path $nsis ($setup.Name -replace '-setup\.exe$', '-offline-setup.exe')
          Move-Item $setup.FullName $offline
          if ($env:SIGN -eq 'true') {
            $s = Get-AuthenticodeSignature $offline
            "{0}: {1} ({2})" -f (Split-Path $offline -Leaf), $s.Status, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { throw "offline installer is $($s.Status)" }
          }
          gh release upload $env:TAG $offline --clobber
