name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # the app is Windows-only (Windows OCR, XInput, Win32 window APIs)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # also produces dist/, which the Rust build embeds
      - run: npm run build

      # cascx.exe: our read-only CascLib wrapper, built from source (MIT, pinned commit in
      # tools/datamine/build-cascx.mjs). It ships as a Tauri sidecar, so it must exist before
      # the Rust build reads tauri.conf.json.
      - name: Cache the cascx sidecar
        id: cascx
        uses: actions/cache@v4
        with:
          path: src-tauri/bin
          key: cascx-${{ runner.os }}-${{ hashFiles('tools/datamine/cascx/cascx.cpp', 'tools/datamine/build-cascx.mjs') }}

      - name: Build the cascx sidecar
        if: steps.cascx.outputs.cache-hit != 'true'
        run: node tools/datamine/build-cascx.mjs --sidecar

      # installs the toolchain pinned in rust-toolchain.toml
      - run: rustup toolchain install
        working-directory: src-tauri

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check --locked --all-targets
        working-directory: src-tauri

      - run: cargo test --locked --lib
        working-directory: src-tauri

  worker:
    # the debug-report upload Worker (worker/): typecheck and unit tests; deploys are manual
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
