# Sanctuary Toolkit debug-report upload Worker. Setup: see README.md in this folder.
name = "sanctuary-reports"
main = "src/index.ts"
compatibility_date = "2026-10-01"
account_id = "a8997be9f2c11feee8d473739c61b887"

# the app posts to https://reports.mscrnt.com/report (change here and in the app's REPORT_URL together)
routes = [{ pattern = "reports.mscrnt.com", custom_domain = true }]
workers_dev = false
# reports.mscrnt.com is the only way in: workers.dev and version preview URLs would bypass the WAF rate-limit rule
preview_urls = false

[vars]
S3_ENDPOINT = "https://s3.mscrnt.com"
S3_BUCKET = "d4-companion"
S3_PREFIX = "debug/"
S3_REGION = "us-east-1"
MAX_BYTES = "26214400"        # 25 MB per report (Cloudflare caps any request at 100 MB)
PER_IP_PER_HOUR = "5"
DAILY_CAP = "300"             # all users together
# optional GitHub issue per report: "on" needs the GITHUB_TOKEN binding below
GITHUB_ISSUES = "on"
GITHUB_REPO = "mscrnt/sanctuary-toolkit-reports"
GITHUB_REPO_PRIVATE = "true"  # "false" = metadata only (report ID, version, OS, size)
GITHUB_DAILY_CAP = "20"
GITHUB_LABELS = "debug-report" # e.g. "debug-report" (the label must exist in the repo)

# storage keys: upload-only MinIO user, kept in the Cloudflare Secrets Store (never in this repo)
[[secrets_store_secrets]]
binding = "S3_ACCESS_KEY"
store_id = "bcb7b4f126c34f73bf937626027200fa"
secret_name = "D4_COMPANION_S3_ACCESS_KEY"

[[secrets_store_secrets]]
binding = "S3_SECRET_KEY"
store_id = "bcb7b4f126c34f73bf937626027200fa"
secret_name = "D4_COMPANION_S3_SECRET_KEY"

# fine-grained token, one repo (mscrnt/sanctuary-toolkit-reports), Issues read/write
[[secrets_store_secrets]]
binding = "GITHUB_TOKEN"
store_id = "bcb7b4f126c34f73bf937626027200fa"
secret_name = "D4_COMPANION_GITHUB_TOKEN"

# burst limit per IP (the binding only supports 10 s or 60 s windows; hourly/daily caps use KV)
[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 2, period = 60 }

# hourly per-IP and daily counters: create with `npx wrangler kv namespace create COUNTERS` and paste the id
[[kv_namespaces]]
binding = "COUNTERS"
id = "f4aad7f13293465c9ba4178afacc2040"

# IP_SALT is a Worker secret: `npx wrangler secret put IP_SALT` (any long random string)
