...Diablo4UgDocumentBuildVariantAssignedSkillsV1Fragment
...Diablo4UgDocumentBuildVariantParagonV1Fragment
...Diablo4UgDocumentBuildVariantMercenaryV1Fragment
...Diablo4UgDocumentBuildVariantWarPlanV1Fragment
...Diablo4UgDocumentDataBuildVariantsFragment
lootFilter
  }

fragment Diablo4UgDocumentDataBuildVariantsFragment on Diablo4UserGeneratedDocumentData {
buildVariants {
  values {
    id
    equipmentPriorityList {
      slug
      type
      iconURL
      modifiers {
        iconURL
        slug
        type
      }
      notes {
        value
        placeholder
        charLimit
      }
    }
    talismansPriorityList {
      slug
      type
      iconURL
      modifiers {
        iconURL
        slug
        type
      }
      notes {
        value
        placeholder
        charLimit
      }
    }
    genericBuilder {
      slots {
        gameSlotSlug
        gameEntity {
          modifiers {
            gearStats {
              id
              isGreater
              isMasterwork
            }
            implicitStats {
              id
            }
            socketStats {
              slug
              type
              ... on D4EntityObject {
                entity {
                  ... on D4Gem {
                    __typename
                    iconUrl
                  }
                  ... on D4Rune {
                    type
                    __typename
                  }
                }
              }
            }
            temperingStats {
              id
              isGreater
              isMasterwork
            }
            sealStats {
              id
            }
            charmStats {
              id
            }
            transfiguredStats {
              id
            }
            kulleanTransfiguredStats {
              id
            }
            isMythic
          }
          entity {
            ... on D4Seal {
              __typename
              iconUrl
              title: name
              rarity
            }
            ... on D4Charm {
              __typename
              iconUrl
              title: name
              rarity
            }
            ... on D4ChaosPerk {
              __typename
              iconUrl
              title: name
              rarity
            }
            ... on D4Aspect {
              __typename
              iconUrl
              title: name
            }
            ... on D4UniqueItem {
              __typename
              iconUrl
              title: name
              chaos
              mythic
            }
            ... on D4TriadPower {
              __typename
              iconUrl
              title: name
              splinterSlug
            }
          }
        }
      }
    }
  }
}
  }

fragment Diablo4UgDocumentBuildVariantWarPlanV1Fragment on Diablo4UserGeneratedDocumentData {
buildVariants {
  values {
    id
    warPlan {
      warplanTrees {
        warplanTree {
          slug
        }
        warplanNodes {
          slug
        }
      }
    }
  }
}
  }

fragment Diablo4UgDocumentBuildVariantMercenaryV1Fragment on Diablo4UserGeneratedDocumentData {
buildVariants {
  values {
    id
    mercenary {
      opportunity {
        opportunity {
          slug
        }
        skill {
          slug
        }
      }
      primaryMercenary {
        slug
      }
      reinforcementMercenary {
        slug
      }
      skill {
        slug
      }
      skillTree {
        actionType
        skill {
          slug
        }
      }
    }
  }
}
  }

fragment Diablo4UgDocumentBuildVariantParagonV1Fragment on Diablo4UserGeneratedDocumentData {
buildVariants {
  values {
    id
    paragon {
      nodes {
        slug
      }
      boards {
        x
        y
        rotation
        board {
          slug
        }
        glyph {
          slug
        }
        glyphLevel
      }
      priorityList {
        iconURL
        slug
        type
      }
    }
  }
}
  }

fragment Diablo4UgDocumentMatchingInfoFragment on NgfMatchingInfo {
id

autoSyncInterval
autoTrackingDisabled

error
errorMessage

nextItems {
  ...NgfMatchableEntityFragment
  children {
    ...NgfMatchableEntityFragment
    children {
      ...NgfMatchableEntityFragment
    }
  }
}
items {
  ...NgfMatchableEntityFragment
  children {
    ...NgfMatchableEntityFragment
    children {
      ...NgfMatchableEntityFragment
      children {
        ...NgfMatchableEntityFragment
      }
    }
  }
}

matchingTarget {
  key
}
variantId
  }

fragment NgfMatchableEntityFragment on NgfMatchableEntity {
id
slug
name
isNext
matchRate
matched
type
targetName
targetSlug
lastMatchedTime
autoTrackingDisabled
  }

fragment NgfUgDocumentFragment on NgfUserGeneratedDocument {
id
category
slugifiedName
type
typeData {
  slug
  displayMetadata {
    coverImageUrlPattern
  }
}
content: contentV2 {
  ...NgfDocumentContentFragment
}
data {
  ...NgfUgDocumentDataFragment
}
version
status
author {
  ...NgfDocumentAuthorFragment
}
seo {
  ...NgfDocumentSeoFragment
}
favorites {
  ...NgfDocumentFavoritesFragment
}
comments {
  ...NgfDocumentCommentsFragment
}
featured {
  ...NgfDocumentFeaturedFragment
}
tags {
  data {
    ...NgfDocumentTagFragment
  }
}
createdAt
updatedAt
firstPublishedAt
  }

fragment NgfUgDocumentDataFragment on NgfUserGeneratedDocumentData {
name
childrenIds
backgroundImage
tierLists {
  ...NgfDocumentDataTierListsFragment
}
...NgfUgDocumentDataBuildVariantsFragment
  }

fragment NgfUgDocumentDataBuildVariantsFragment on NgfUserGeneratedDocumentData {
buildVariants {
  values {
    id
    genericBuilder {
      slots {
        gameSlotSlug
        gameEntity {
          ...NgfDocumentGameEntityFragment
        }
      }
    }
  }
}
  }
